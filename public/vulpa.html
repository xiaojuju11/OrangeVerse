<title>橘宝 · 3D 治愈情绪玩伴 · OrangeVerse</title>

<!-- 网络字体改为 load 后异步注入：避免外网字体样式表阻塞首屏渲染、拖慢 load 事件 -->
<script>
  (function () {
    var href =
      "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap";
    function inject() {
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      document.head.appendChild(link);
    }
    if (document.readyState === "complete") inject();
    else window.addEventListener("load", inject, { once: true });
  })();
</script>

<!-- three 与 addons 已由 scripts/vendor-three.mjs 打包到同源 /vendor/three.bundle.js：
     不依赖任何外部 CDN，国内网络也能正常唤醒 3D 场景。 -->

<style>
:root {
  --sky-top: #fbd873;
  --sky-mid: #fce595;
  --sky-low: #fef1c9;
  --mist: #fffaf0;
  --ink: #1e1b18;
  --ink-soft: #685e55;
  --orange: #f28b3a;
  --orange-deep: #e9741f;
  --pink-blush: #ff5577;
  --card-bg: rgba(255, 255, 255, 0.88);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  font-family: "Plus Jakarta Sans", "Noto Sans SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--sky-top);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.pet-universe {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  background:
    radial-gradient(120% 70% at 50% 0%, #fbd568 0%, rgba(251, 213, 104, 0) 60%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, var(--sky-low) 66%, var(--mist) 90%);
}

/* 顶部状态栏 */
.pet-topbar {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
}

.pet-identity {
  display: flex;
  align-items: center;
  gap: 12px;
}

.pet-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f28b3a, #e9741f);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 14px rgba(233, 116, 31, 0.35);
  border: 2px solid #fff;
}

.pet-name-box {
  display: flex;
  flex-direction: column;
}

.pet-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pet-name {
  font-size: 16px;
  font-weight: 800;
  color: #241a13;
}

.pet-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(242, 139, 58, 0.16);
  color: #d85c0b;
  border: 1px solid rgba(242, 139, 58, 0.35);
}

.pet-status-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #7a6e65;
  margin-top: 2px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 8px #22c55e;
}

/* 好感度条 */
.affection-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.75);
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
}

.affection-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--pink-blush);
}

.affection-bar-bg {
  width: 80px;
  height: 8px;
  background: #fae1ce;
  border-radius: 4px;
  overflow: hidden;
}

.affection-bar-fill {
  width: 88%;
  height: 100%;
  background: linear-gradient(90deg, #ff758c 0%, #ff5577 100%);
  border-radius: 4px;
  transition: width 0.4s ease-out;
}

.affection-val {
  font-family: monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--pink-blush);
}

/* 控制按钮 */
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.action-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;

  background: rgba(255, 255, 255, 0.85);

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;
  transition: all 0.2s;
}

.action-pill-btn:hover {
  background: #fff;
  transform: translateY(-1px);
}

/* 核心 3D 画布 */
.stage {
  position: absolute;
  inset: 0;
  z-index: 2;
  cursor: grab;
}

.stage:active {
  cursor: grabbing;
}

#fox-canvas {
  width: 100%;
  height: 100%;
  display: block;
  outline: none;
}

/* 动态拟真漫画气泡 (Comic Speech Bubble) */
.speech-bubble-anchor {
  position: absolute;
  top: 26%;
  left: 50%;
  transform: translate(-50%, -100%);
  pointer-events: none;
  z-index: 25;
}

.speech-bubble {
  position: relative;
  max-width: 380px;
  min-width: 220px;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 20px;
  box-shadow: 0 12px 35px rgba(220, 120, 30, 0.16);
  border: 1.5px solid #fff;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  color: #2b231c;
  pointer-events: auto;
  transform-origin: bottom center;
  animation: bubblePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.speech-bubble::after {
  content: "";
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 8px;
  background: rgba(255, 255, 255, 0.95);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}

@keyframes bubblePop {
  0% { transform: scale(0.6) translateY(15px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

.interaction-deck {
  position: relative;
  z-index: 30;
  padding: 0 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  pointer-events: none;
}

.deck-island {
  pointer-events: auto;

</style>

<script type="module">
import * as THREE from "/vendor/three.bundle.js";
import { GLTFLoader } from "/vendor/three.bundle.js";

// ═════════════════════════════════════════════════════════════════════════
// 1. Web Audio 算法音效引擎 (Duang~、呼噜声、吃橘子、颂钵微音)
// ═════════════════════════════════════════════════════════════════════════
class PetAudio {
  constructor() {
    this.enabled = true;
    this.ctx = null;
  }
  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) this.ctx = new AudioCtx();
  }
  // 果冻 Q 弹音效 (Duang~ / Boing)
  playBoing(pitch = 280) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(pitch, t);
    osc.frequency.exponentialRampToValueAtTime(pitch * 2.2, t + 0.08);
    osc.frequency.exponentialRampToValueAtTime(pitch * 1.1, t + 0.22);

    gain.gain.setValueAtTime(0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.23);
  }
  // 舒服呼噜噜 (Purr)
  playPurr() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    const gain = this.ctx.createGain();

    osc.type = "triangle";
    osc.frequency.value = 110;

    lfo.type = "sine";
    lfo.frequency.value = 22;
    lfoGain.gain.value = 45;

    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    gain.gain.setValueAtTime(0.04, t);
    gain.gain.linearRampToValueAtTime(0.08, t + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    lfo.start(t);
    osc.start(t);
    lfo.stop(t + 0.86);
    osc.stop(t + 0.86);
  }
  // 吃橘子咀嚼声
  playMunch() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const dt = t + i * 0.12;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(450 + Math.random() * 80, dt);
      osc.frequency.exponentialRampToValueAtTime(220, dt + 0.08);

      gain.gain.setValueAtTime(0.06, dt);
      gain.gain.exponentialRampToValueAtTime(0.0001, dt + 0.08);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(dt);
      osc.stop(dt + 0.09);
    }
  }
}
const sound = new PetAudio();

// ═════════════════════════════════════════════════════════════════════════
// 2. 原版 Vulpa 3D 狐狸模型加载与 Shader 骨架搭建 (保持原版形象 100% 忠实)
// ═════════════════════════════════════════════════════════════════════════
const MODEL_URL = "./fox.glb";

// 原版 Vulpa 骨架常数
const neck = [0.98, 1.14];
const pivot = [-0.165, 1.02, 0.15];
const eyeL = [-0.34, 1.30, 0.474];
const eyeR = [0.011, 1.313, 0.496];
const eyeSize = [0.108, 0.112, 0.075];
const eyeTilt = 0.25;
const eyeToe = 0.12;
const headYaw = 0.42;
const headPitch = 0.24;
const eyeYaw = 0.5;
const eyePitch = 0.38;

const canvas = document.getElementById("fox-canvas");
const stage = document.getElementById("stage");
const loaderCover = document.getElementById("loader-cover");

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha: true,
  antialias: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
const scene = new THREE.Scene();

const hemiLight = new THREE.HemisphereLight(0xfffaf0, 0xf6cf86, 2.1);
scene.add(hemiLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight1.position.set(-2.5, 4, 5);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xffe2a8, 0.8);
dirLight2.position.set(3, 2.5, -4);
scene.add(dirLight2);

// 核心果冻形变根节点 (用于 DeepSeek 大肥鱼同款的果冻挤压形变)
const squishRoot = new THREE.Group();
scene.add(squishRoot);

const fox = new THREE.Group();
squishRoot.add(fox);

const head = new THREE.Group();
head.position.set(pivot[0], pivot[1], pivot[2]);
fox.add(head);

// 共享头部矩阵 Uniform (用于原版顶点着色器形变)
const uHead = { value: new THREE.Matrix3() };

function bendHead(shader) {
  shader.uniforms.uHead = uHead;
  shader.vertexShader = shader.vertexShader.replace(
    "#include <common>",
    `#include <common>
    uniform mat3 uHead;
    float headWeight(vec3 p) {
      float w = smoothstep(0.980, 1.140, p.y);
      float tail = smoothstep(0.26, 0.36, p.x) * (1.0 - smoothstep(0.0, 0.14, p.z)) * (1.0 - smoothstep(1.18, 1.28, p.y));
      float map = smoothstep(0.58, 0.66, p.z) * (1.0 - smoothstep(1.0, 1.06, p.y));
      return w * (1.0 - tail) * (1.0 - map);
    }`
  );
  shader.vertexShader = shader.vertexShader.replace(
    "#include <beginnormal_vertex>",
    `#include <beginnormal_vertex>
    float hw = headWeight(position);
    objectNormal = normalize(mix(objectNormal, uHead * objectNormal, hw));`
  );
  shader.vertexShader = shader.vertexShader.replace(
    "#include <begin_vertex>",
    `#include <begin_vertex>
    vec3 P = vec3(-0.165, 1.020, 0.150);
    transformed = mix(transformed, P + uHead * (transformed - P), hw);`
  );
}

function drawEyeTexture() {
  ctx.clearRect(0, 0, 1024, 512);

  if (currentEyeMood === "normal") {
    // 原版琥珀色灵动大眼
    for (const cx of [256, 768]) {
      ctx.fillStyle = "#fffdfa";
      ctx.beginPath();
      ctx.arc(cx, 256, 210, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, 256, 118, 0, Math.PI * 2);
      ctx.fillStyle = "#331604";
      ctx.fill();

      const grad = ctx.createRadialGradient(cx, 282, 20, cx, 256, 110);
      grad.addColorStop(0, "#ffaa44");
      grad.addColorStop(0.55, "#e66010");
      grad.addColorStop(1, "#803005");
      ctx.beginPath();
      ctx.arc(cx, 256, 110, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, 256, 66, 0, Math.PI * 2);
      ctx.fillStyle = "#120802";
      ctx.fill();

      ctx.save();
      ctx.translate(cx - 34, 216);
      ctx.rotate(-0.5);
      ctx.beginPath();
      ctx.ellipse(0, 0, 24, 20, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx + 36, 296, 9, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.fill();
    }
  } else if (currentEyeMood === "happy") {
    // 摸头弯弯月牙笑眼 ( ^ ▽ ^ )
    for (const cx of [256, 768]) {
      ctx.fillStyle = "#fffdfa";
      ctx.beginPath();
      ctx.arc(cx, 256, 210, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 42;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#441c06";
      ctx.beginPath();
      ctx.arc(cx, 330, 130, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }
  } else if (currentEyeMood === "poked") {
    // 被戳挤压眼 ( > < )
    for (const [idx, cx] of [256, 768].entries()) {
      ctx.fillStyle = "#fffdfa";
      ctx.beginPath();
      ctx.arc(cx, 256, 210, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 44;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#441c06";
      ctx.beginPath();
      const dir = idx === 0 ? 1 : -1;
      ctx.moveTo(cx - 90 * dir, 160);
      ctx.lineTo(cx + 40 * dir, 256);
      ctx.lineTo(cx - 90 * dir, 350);
      ctx.stroke();
    }
  } else if (currentEyeMood === "sleepy") {
    // 沉睡长睫毛 ( - _ - )
    for (const cx of [256, 768]) {
      ctx.fillStyle = "#fffdfa";
      ctx.beginPath();
      ctx.arc(cx, 256, 210, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 36;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#441c06";
      ctx.beginPath();
      ctx.arc(cx, 220, 110, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }
  }

  eyeTexture.needsUpdate = true;
}

function makeEye(pos, side) {
  const socket = new THREE.Group();
  socket.position.set(pos[0] - pivot[0], pos[1] - pivot[1], pos[2] - pivot[2]);
  socket.rotation.y = side * eyeTilt;
  socket.scale.set(eyeSize[0], eyeSize[1], eyeSize[2]);

  const geo = new THREE.SphereGeometry(1, 48, 32);
  const mat = new THREE.MeshStandardMaterial({
    map: eyeTexture,
    roughness: 0.22,
    metalness: 0
  });
  const sphere = new THREE.Mesh(geo, mat);
  sphere.userData.side = side;
  socket.add(sphere);
  head.add(socket);
  return sphere;
}

const loader = new GLTFLoader();
loader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;
    model.rotation.y = -Math.PI / 2 - 0.16;
    model.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    const centre = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(centre);

    // 归一化之后世界坐标里的宽度才是取景/命中检测该用的数值
    const s = 2 / size.y;
    foxWidth = size.x * s;
    const fit = new THREE.Matrix4()
      .makeScale(s, s, s)
      .multiply(new THREE.Matrix4().makeTranslation(-centre.x, -box.min.y, -centre.z));

    model.traverse((child) => {
      if (child.isMesh) {
        const geom = child.geometry.clone();
        geom.applyMatrix4(fit.clone().multiply(child.matrixWorld));
        geom.computeBoundingSphere();

        const mat = child.material.clone();
        mat.metalness = 0;
        mat.roughness = 1;
        mat.onBeforeCompile = bendHead;

        const mesh = new THREE.Mesh(geom, mat);
        mesh.frustumCulled = false;
        fox.add(mesh);
      }
    });

    resize();
    loaderCover.classList.add("hide");
    console.log("🦊 原版 Vulpa 3D 狐狸载入完成！");

  undefined,
  (err) => {
    console.error("Fox load error:", err);
    loaderCover.textContent = "小狐狸还在赶来路上，请刷新重试~";
  }
);

// 4. 指针交互与自适应窗口
// ═════════════════════════════════════════════════════════════════════════
// 模型按高度归一化到 FOX_HEIGHT 个单位，整只狐狸居中放在 y ∈ [0, FOX_HEIGHT]
const FOX_HEIGHT = 2;
/** 画面上下各留一点呼吸位，避免耳朵顶到工具栏、脚爪贴住互动舱。 */
const FRAME_PADDING = 10;

/** 顶栏与底部互动舱之间的空白区域（相对 canvas 的像素坐标），角色只在这条带子里取景。 */
function safeBand(rect) {
  const topbar = document.querySelector(".pet-topbar");
  const deck = document.querySelector(".interaction-deck");
  const top = topbar ? Math.max(0, topbar.getBoundingClientRect().bottom - rect.top) : 0;
  const bottom = deck
    ? Math.min(rect.height, deck.getBoundingClientRect().top - rect.top)
    : rect.height;
  // 小屏或结构变动导致条带过窄时退回整屏，宁可贴边也不要把角色缩成一点。
  if (bottom - top < rect.height * 0.3) return { top: 0, bottom: rect.height };
  return { top, bottom };
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;
  if (!width || !height) return;

  camera.aspect = width / height;
  const vfov = 2 * Math.atan(Math.tan((camera.fov * Math.PI) / 360) * Math.max(1, 1 / camera.aspect));
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const tanV = Math.tan(vfov / 2);
  const tanH = Math.tan(hfov / 2);

  // 修正前这里用未缩放的 foxWidth 算距离，模型被放大到 2 个单位后距离没跟着变，
  // 屏幕上只剩一张怼脸的狐狸特写。现在同时按「高度装得下」和「宽度装得下」取较大距离。
  const band = safeBand(rect);
  const usableH = Math.max(band.bottom - band.top - FRAME_PADDING * 2, height * 0.3);
  const distY = (FOX_HEIGHT * height) / (2 * tanV * usableH);
  const distX = (Math.max(foxWidth, 0.6) * 1.06) / (2 * tanH);
  const dist = Math.max(distY, distX);

  // 把模型中心对齐到安全带中心：整体上移一点，给底部互动舱让位。
  const visibleH = 2 * dist * tanV;
  const bandCentre = (band.top + band.bottom) / 2;
  const camY = FOX_HEIGHT / 2 - ((height / 2 - bandCentre) / height) * visibleH;

  camera.position.set(0, camY, dist);
  camera.lookAt(0, camY, 0);
  camera.updateProjectionMatrix();

  renderer.setSize(width, height, false);
}
window.addEventListener("resize", resize);

// 视线追踪与摸头交互
window.addEventListener("pointermove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const faceWorld = new THREE.Vector3(pivot[0], eyeL[1], eyeL[2]);
  faceWorld.applyMatrix4(fox.matrixWorld);
  faceWorld.project(camera);

  const faceX = rect.left + (faceWorld.x * 0.5 + 0.5) * rect.width;
  const faceY = rect.top + (-faceWorld.y * 0.5 + 0.5) * rect.height;

  const reach = Math.max(window.innerWidth, window.innerHeight) * 0.42;
  physics.aim.x = THREE.MathUtils.clamp((e.clientX - faceX) / reach, -1, 1);
  physics.aim.y = THREE.MathUtils.clamp((e.clientY - faceY) / reach, -1, 1);
  physics.lastMove = performance.now();

  // 摸摸头检测
  const distToFace = Math.hypot(e.clientX - faceX, e.clientY - faceY);
  if (distToFace < 140) {
    const dx = e.clientX - physics.lastMousePos.x;
    const dy = e.clientY - physics.lastMousePos.y;
    physics.strokeSpeed += Math.hypot(dx, dy);
    if (physics.strokeSpeed > 260) {
      triggerPet();
      physics.strokeSpeed = 0;
    }
  }

  physics.lastMousePos.set(e.clientX, e.clientY);
  physics.idleTimer = 0;
  wakeUp();
  document.getElementById("pet-hint").style.opacity = "0";
}, { passive: true });

  input.value = "";
  wakeUp();

  let reply = "小狐狸认真听完啦！生活总有阴晴，但你永远拥有把今天过得温暖明亮的能力，小狐狸陪着你！💖";
  for (const item of DIALOGUES.treehole) {
    if (item.k.some(kw => val.includes(kw))) {
      reply = item.r;
      break;
    }
  }
  // 先播摸头的动画/音效，再说话：否则树洞回复会被摸头对白立即覆盖掉
  triggerPet({ silent: true });
  say(reply, "🌟");
  moodDesc.textContent = "认真听你说完心里话 · 想给你一个拥抱";
}

document.getElementById("treehole-send").addEventListener("click", handleTreehole);
document.getElementById("treehole-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleTreehole();
});

// 音效与归位按钮
const soundBtn = document.getElementById("sound-btn");
soundBtn.addEventListener("click", () => {
  sound.enabled = !sound.enabled;
  soundBtn.textContent = sound.enabled ? "🔊 音效: 开" : "🔈 音效: 关";
  if (sound.enabled) sound.playBoing(360);
});

document.getElementById("reset-cam-btn").addEventListener("click", () => {
  resize();
  say("视角摆正啦，小狐狸一直在中心看着你！", "🦊");
});

// ═════════════════════════════════════════════════════════════════════════
// 5. 渲染循环 (60+ FPS，结合原版头部 Shader 与果冻弹性)
// ═════════════════════════════════════════════════════════════════════════
const euler = new THREE.Euler(0, 0, 0, "YXZ");
const tempMatrix4 = new THREE.Matrix4();
let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const elapsed = now / 1000;

  // A. 果冻弹性形变阻尼计算 (二阶阻尼谐振子)
  const k = 190;
  const c = 13;
  const springF = -k * (physics.squish - physics.targetSquish);
  const dampF = -c * physics.squishVel;
  physics.squishVel += (springF + dampF) * dt;
  physics.squish += physics.squishVel * dt;
  physics.targetSquish += (1.0 - physics.targetSquish) * (1 - Math.exp(-dt * 6));

  // 体积守恒挤压压扁
  const sY = Math.max(0.45, physics.squish);
  const sXZ = 1 / Math.sqrt(sY);
  squishRoot.scale.set(sXZ, sY, sXZ);

  // 深呼吸引导柔和膨胀
  if (physics.isBreathingGuide) {
    const breath = 1.0 + Math.sin(elapsed * 0.65) * 0.08;
    squishRoot.scale.multiplyScalar(breath);
  }

  // B. 原版头部与视线注视追踪计算
  const idle = performance.now() - physics.lastMove > 3000;
  if (idle && !physics.isSleeping) {
    physics.aim.set(
      Math.sin(elapsed * 0.55) * 0.55,
      Math.sin(elapsed * 0.9 + 1) * 0.22 - 0.05
    );
  }

  physics.look.lerp(physics.aim, 1 - Math.exp(-dt * 11));
  physics.turn.lerp(physics.aim, 1 - Math.exp(-dt * 4.5));

  if (!physics.isSleeping) {
    euler.set(physics.turn.y * headPitch, physics.turn.x * headYaw, -physics.turn.x * 0.05, "YXZ");
  } else {
    euler.set(0.35, 0.08, 0, "YXZ"); // 睡觉低头
  }

  head.rotation.copy(euler);
  tempMatrix4.makeRotationFromEuler(euler);
  uHead.value.setFromMatrix4(tempMatrix4);

  const ex = THREE.MathUtils.clamp(physics.look.x * 1.25 - physics.turn.x * 0.35, -1, 1);
  const ey = THREE.MathUtils.clamp(physics.look.y * 1.25 - physics.turn.y * 0.35, -1, 1);

  if (leftEyeMesh && currentEyeMood === "normal") {
    leftEyeMesh.rotation.set(ey * eyePitch, ex * eyeYaw - leftEyeMesh.userData.side * eyeToe, 0, "YXZ");
  }
  if (rightEyeMesh && currentEyeMood === "normal") {
    rightEyeMesh.rotation.set(ey * eyePitch, ex * eyeYaw - rightEyeMesh.userData.side * eyeToe, 0, "YXZ");
  }

  // C. 粒子生命周期
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.vel.y -= 1.8 * dt;
    p.mesh.scale.setScalar(Math.max(0, p.life / p.maxLife));
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);

    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }

  // D. 呼吸悬浮微动
  fox.position.y = Math.sin(elapsed * 1.8) * 0.015;

  // E. 自动打瞌睡
  physics.idleTimer += dt;
  if (physics.idleTimer > 14 && !physics.isSleeping && !physics.isBreathingGuide) {
    triggerSleep();
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
