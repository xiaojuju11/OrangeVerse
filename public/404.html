<!DOCTYPE html>
<html lang="zh">
<head>

<script type="importmap">

<style>
:root {
  --sky-top: #060914;
  --sky-mid: #0b1122;
  --sky-low: #131c36;
  --mist: rgba(14, 22, 44, 0.95);
  --ink: #f0f6ff;
  --ink-soft: #94a8d0;
  --fox: #ff8533;
  --fox-deep: #e65c00;
  --pad: clamp(18px, 4.2vw, 54px);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: "Manrope", system-ui, sans-serif;
  color: var(--ink);
  background: var(--sky-top);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.page {
  position: relative;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(100% 70% at 50% 0%, rgba(255, 130, 40, 0.12) 0%, transparent 60%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-low) 75%, var(--sky-top) 100%);
}

/* 星空粒子与全息网格 */
#stars-bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
}

.grid-overlay {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(120, 180, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 180, 255, 0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, #000 35%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, #000 35%, transparent 100%);
}

.sky {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

/* 霓虹星云漂移 */
.cloud {
  position: absolute;
  border-radius: 50%;
  filter: blur(28px);
  animation: drift 38s ease-in-out infinite alternate;
  background:
    radial-gradient(closest-side, rgba(255, 140, 50, 0.18), transparent) 0% 70% / 50% 60% no-repeat,
    radial-gradient(closest-side, rgba(90, 150, 255, 0.15), transparent) 50% 30% / 60% 70% no-repeat;
}

.c1 { left: -9%; top: 33%; width: 35%; height: 35%; opacity: .6; }
.c2 { left: 4%; top: 49%; width: 38%; height: 38%; opacity: .7; animation-duration: 46s; }
.c3 { right: -8%; top: 22%; width: 35%; height: 38%; opacity: .65; animation-duration: 52s; animation-direction: alternate-reverse; }
.c4 { right: 2%; top: 46%; width: 40%; height: 40%; opacity: .7; animation-duration: 42s; animation-direction: alternate-reverse; }
.c5 { left: 8%; top: 27%; width: 16%; height: 14%; opacity: .4; }

@keyframes drift {
  from { transform: translateX(-1.5%); }
  to { transform: translateX(1.5%); }
}

.mist {
  position: absolute;
  left: -10%;
  right: -10%;
  bottom: -6%;
  height: 50%;
  background:
    radial-gradient(60% 70% at 50% 70%, rgba(255, 130, 40, 0.08), transparent 70%),
    linear-gradient(180deg, transparent 0%, rgba(8, 14, 28, 0.8) 55%, var(--sky-top) 85%);
}

.top {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--pad) * .72 + env(safe-area-inset-top)) var(--pad) 0;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  text-decoration: none;
  font: 700 clamp(22px, 2.4vw, 30px)/1 "Quicksand", "Manrope", sans-serif;
  letter-spacing: -.02em;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, #ff9944, #e65c00);
  box-shadow: 0 0 16px rgba(255, 133, 51, 0.45);
  font-size: 16px;
}

.login {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: clamp(38px, 3.8vw, 46px);
  padding: 0 clamp(14px, 1.3vw, 18px);
  color: #dbeafe;
  font: 600 clamp(14px, 1.25vw, 15px)/1 "Manrope", sans-serif;
  letter-spacing: -.01em;
  text-decoration: none;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: transform .2s ease, background .2s ease, border-color .2s ease;
}
.login:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 140, 50, 0.6);
  color: #fff;
}

.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  container-type: size;
}

.digits {
  position: absolute;
  left: 50%;
  bottom: 3.5%;
  transform: translateX(-50%) scaleX(.86);
  margin: 0;
  font-family: "Manrope", sans-serif;
  font-weight: 800;
  font-size: min(116cqh, 52cqw);
  line-height: .73;
  letter-spacing: -.012em;
  white-space: nowrap;
  color: rgba(255, 140, 50, 0.14);
  mask-image: linear-gradient(180deg, #000 50%, rgba(0, 0, 0, .2) 100%);
  -webkit-mask-image: linear-gradient(180deg, #000 50%, rgba(0, 0, 0, .2) 100%);
  user-select: none;
  pointer-events: none;
}

#fox {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: pan-y;
  opacity: 0;
  transition: opacity .7s ease;
}
#fox.ready {
  opacity: 1;
}

.shadow {
  position: absolute;
  left: 50%;
  bottom: 1.2%;
  width: min(34cqh, 40cqw);
  height: 3.2cqh;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(255, 130, 40, 0.28), transparent);
  opacity: 0;
  transition: opacity .7s ease;
  pointer-events: none;
}
#fox.ready + .shadow {
  opacity: 1;
}

.loading {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  font: 600 14px/1 "Manrope", sans-serif;
  color: #ffaa66;
  letter-spacing: .02em;
  transition: opacity .4s ease;
}
.loading.hide {
  opacity: 0;
  pointer-events: none;
}

.copy {
  position: relative;
  z-index: 2;
  flex: none;
  text-align: center;
  padding: clamp(6px, 1.4vh, 16px) var(--pad) calc(clamp(14px, 2.3vh, 24px) + env(safe-area-inset-bottom));
}
.copy h1 {
  margin: 0;
  font: 700 clamp(26px, min(4vw, 7vh), 52px)/1.1 "Manrope", sans-serif;
  letter-spacing: -.035em;
  background: linear-gradient(135deg, #ffffff 0%, #ffc085 45%, #ff8533 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-wrap: balance;
}
.copy p {
  margin: clamp(6px, 1.3vh, 12px) 0 0;
  font: 500 clamp(15px, min(1.8vw, 3.2vh), 22px)/1.25 "Manrope", sans-serif;
  letter-spacing: -.02em;
  color: var(--ink-soft);
  text-wrap: balance;
}

.home {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: clamp(12px, 2.2vh, 20px);
  height: clamp(42px, 6vh, 48px);
  padding: 0 20px 0 14px;
  color: #fff;
  font: 600 clamp(14px, 1.3vw, 16px)/1 "Manrope", sans-serif;
  letter-spacing: -.01em;
  text-decoration: none;
  border-radius: 14px;
  background: linear-gradient(180deg, #ff944d 0%, var(--fox) 50%, var(--fox-deep) 100%);
  box-shadow: 0 10px 24px rgba(255, 110, 20, 0.38), 0 2px 4px rgba(180, 70, 10, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  transition: transform .2s ease, box-shadow .2s ease;
}
.home svg {
  width: 18px;
  height: 18px;
  transition: transform .2s ease;
}
.home:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(255, 110, 20, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.home:hover svg {
  transform: translateX(-3px);
}
.home:active {
  transform: translateY(0);
}

a:focus-visible {
  outline: 3px solid #ff9944;
  outline-offset: 3px;
}

@media (max-width: 640px) {
  .digits { font-size: min(110cqh, 72cqw); bottom: 13%; }
}
@media (max-height: 430px) {
  .top { padding-top: 12px; }
  .copy p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cloud { animation: none; }
  .login, .home, .home svg, #fox, .shadow { transition: none; }
}
</style>

<body>
<div class="page">
  <canvas id="stars-bg"></canvas>
  <div class="grid-overlay" aria-hidden="true"></div>

  <div class="sky" aria-hidden="true">
    <span class="cloud c5"></span>
    <span class="cloud c1"></span>
    <span class="cloud c3"></span>
    <span class="cloud c2"></span>
    <span class="cloud c4"></span>
    <span class="mist"></span>
  </div>

  <header class="top">
    <a class="brand" href="/" aria-label="OrangeVerse 首页">
      <span class="brand-badge">🍊</span>
      <span>OrangeVerse · 橘域</span>
    </a>
    <a class="login" href="https://github.com/xiaojuju11/OrangeVerse" target="_blank" rel="noopener">GitHub 仓库 ↗</a>
  </header>

  <main class="stage">

    <canvas id="fox" role="img" aria-label="橘域的 3D 守护狐狸，拿着星图跟随你的光标"></canvas>
    <span class="shadow" aria-hidden="true"></span>
    <span class="loading" id="loading">正在召唤橘域守护灵…</span>
  </main>

  <section class="copy">
    <h1>迷途在星际坐标？守护狐狸为你引路</h1>
    <p>这个维度的页面已被折叠，小狐狸带你返回主岛宇宙</p>
    <a class="home" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
      返回橘域主岛
    </a>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

// ── 绘制星空微粒 ──────────────────────────────────────────────────────────
const starCanvas = document.getElementById("stars-bg");
const starCtx = starCanvas.getContext("2d");
let stars = [];

function resizeStars() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
}
function initStars() {
  stars = Array.from({ length: 180 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.5 + 0.2,
    a: Math.random() * 0.8 + 0.2,
    speed: Math.random() * 0.35 + 0.1,
    phase: Math.random() * Math.PI * 2
  }));
}
function drawStars(t) {
  starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  for (const s of stars) {
    const alpha = s.a * (0.4 + 0.6 * Math.sin(t * s.speed + s.phase));
    starCtx.beginPath();
    starCtx.arc(s.x * starCanvas.width, s.y * starCanvas.height, s.r, 0, Math.PI * 2);
    starCtx.fillStyle = `rgba(180, 210, 255, ${alpha.toFixed(3)})`;
    starCtx.fill();
  }
}
resizeStars();
initStars();
window.addEventListener("resize", resizeStars);

// ── 3D 狐狸守护灵 ────────────────────────────────────────────────────────
const MODEL_URL = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261014_013004_603cedaa-048c-46da-a737-4c013ad994ae.glb";

const neck = [0.98, 1.14];
const pivot = [-0.165, 1.02, 0.15];
const eyeL = [-0.34, 1.30, 0.474];
const eyeR = [0.011, 1.313, 0.496];
const eyeSize = [0.108, 0.112, 0.075];
const eyeTilt = 0.25;
const eyeToe = 0.12;
const headYaw = 0.42;
const headPitch = 0.24;
const eyeYaw = 0.5;
const eyePitch = 0.38;

const canvas = document.getElementById("fox");
const loading = document.getElementById("loading");
const stage = document.querySelector(".stage");

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha: true,
  antialias: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
const scene = new THREE.Scene();

// 配合深色星空调整光照
const hemiLight = new THREE.HemisphereLight(0xfff5e6, 0x141f36, 2.2);
scene.add(hemiLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.6);
dirLight1.position.set(-2.5, 4, 5);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xff9944, 1.1);
dirLight2.position.set(3, 2.5, -4);
scene.add(dirLight2);

// Shared head matrix uniform
const uHead = { value: new THREE.Matrix3() };

function bendHead(shader) {
  shader.uniforms.uHead = uHead;
  shader.vertexShader = shader.vertexShader.replace(
    "#include <common>",
    `#include <common>
    uniform mat3 uHead;
    float headWeight(vec3 p) {
      float w = smoothstep(0.980, 1.140, p.y);
      float tail = smoothstep(0.26, 0.36, p.x) * (1.0 - smoothstep(0.0, 0.14, p.z)) * (1.0 - smoothstep(1.18, 1.28, p.y));
      float map = smoothstep(0.58, 0.66, p.z) * (1.0 - smoothstep(1.0, 1.06, p.y));
      return w * (1.0 - tail) * (1.0 - map);
    }`
  );
  shader.vertexShader = shader.vertexShader.replace(
    "#include <beginnormal_vertex>",
    `#include <beginnormal_vertex>
    float hw = headWeight(position);
    objectNormal = normalize(mix(objectNormal, uHead * objectNormal, hw));`
  );
  shader.vertexShader = shader.vertexShader.replace(
    "#include <begin_vertex>",
    `#include <begin_vertex>
    vec3 P = vec3(-0.165, 1.020, 0.150);
    transformed = mix(transformed, P + uHead * (transformed - P), hw);`
  );
}

// Eye texture (橘色发光科技星眸)
const eyeCanvas = document.createElement("canvas");
eyeCanvas.width = 1024;
eyeCanvas.height = 512;
const ctx = eyeCanvas.getContext("2d");

ctx.fillStyle = "#fffdfa";
ctx.fillRect(0, 0, 1024, 512);

ctx.beginPath();
ctx.arc(256, 256, 118, 0, Math.PI * 2);
ctx.fillStyle = "#331604";
ctx.fill();

const grad = ctx.createRadialGradient(256, 282, 20, 256, 256, 110);
grad.addColorStop(0, "#ffaa44");
grad.addColorStop(0.55, "#e66010");
grad.addColorStop(1, "#803005");
ctx.beginPath();
ctx.arc(256, 256, 110, 0, Math.PI * 2);
ctx.fillStyle = grad;
ctx.fill();

ctx.beginPath();
ctx.arc(256, 256, 66, 0, Math.PI * 2);
ctx.fillStyle = "#120802";
ctx.fill();

ctx.save();
ctx.translate(222, 216);
ctx.rotate(-0.5);
ctx.beginPath();
ctx.ellipse(0, 0, 24, 20, 0, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();
ctx.restore();

ctx.beginPath();
ctx.arc(292, 296, 9, 0, Math.PI * 2);
ctx.fillStyle = "rgba(255,255,255,.9)";
ctx.fill();

const eyeTexture = new THREE.CanvasTexture(eyeCanvas);
eyeTexture.colorSpace = THREE.SRGBColorSpace;
eyeTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

const fox = new THREE.Group();
scene.add(fox);

const head = new THREE.Group();
head.position.set(pivot[0], pivot[1], pivot[2]);
fox.add(head);

function makeEye(pos, side) {
  const socket = new THREE.Group();
  socket.position.set(pos[0] - pivot[0], pos[1] - pivot[1], pos[2] - pivot[2]);
  socket.rotation.y = side * eyeTilt;
  socket.scale.set(eyeSize[0], eyeSize[1], eyeSize[2]);

  const geo = new THREE.SphereGeometry(1, 48, 32);
  const mat = new THREE.MeshStandardMaterial({
    map: eyeTexture,
    roughness: 0.22,
    metalness: 0
  });
  const sphere = new THREE.Mesh(geo, mat);
  sphere.userData.side = side;
  socket.add(sphere);
  head.add(socket);
  return sphere;
}

let leftEyeMesh = makeEye(eyeL, -1);
let rightEyeMesh = makeEye(eyeR, 1);
let foxWidth = 1;

// Load GLB
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;
    model.rotation.y = -Math.PI / 2 - 0.16;
    model.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    const centre = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(centre);

    const s = 2 / size.y;
    foxWidth = size.x * s;

    const fit = new THREE.Matrix4()
      .makeScale(s, s, s)
      .multiply(new THREE.Matrix4().makeTranslation(-centre.x, -box.min.y, -centre.z));

    model.traverse((child) => {
      if (child.isMesh) {
        const geom = child.geometry.clone();
        geom.applyMatrix4(fit.clone().multiply(child.matrixWorld));
        geom.computeBoundingSphere();
        
        const mat = child.material.clone();
        mat.metalness = 0;
        mat.roughness = 1;
        if (mat.map) {
          mat.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
        }
        mat.onBeforeCompile = bendHead;

        const mesh = new THREE.Mesh(geom, mat);
        mesh.frustumCulled = false;
        fox.add(mesh);
      }
    });

    resize();
    canvas.classList.add("ready");
    loading.classList.add("hide");
    renderer.setAnimationLoop(frame);
  },
  undefined,
  (error) => {
    console.error(error);
    loading.textContent = "橘域守护灵在时空裂隙中迷路了，请刷新页面。";
  }
);

// Pointer tracking
const aim = new THREE.Vector2();
const look = new THREE.Vector2();
const turn = new THREE.Vector2();
let lastMove = -1e9;

function onPointer(e) {
  const rect = canvas.getBoundingClientRect();
  const faceWorld = new THREE.Vector3(pivot[0], eyeL[1], eyeL[2]);
  faceWorld.applyMatrix4(fox.matrixWorld);
  faceWorld.project(camera);

  const faceX = rect.left + (faceWorld.x * 0.5 + 0.5) * rect.width;
  const faceY = rect.top + (-faceWorld.y * 0.5 + 0.5) * rect.height;

  const reach = Math.max(window.innerWidth, window.innerHeight) * 0.42;
  aim.x = THREE.MathUtils.clamp((e.clientX - faceX) / reach, -1, 1);
  aim.y = THREE.MathUtils.clamp((e.clientY - faceY) / reach, -1, 1);
  lastMove = performance.now();
}

window.addEventListener("pointermove", onPointer, { passive: true });
window.addEventListener("pointerdown", onPointer, { passive: true });
document.addEventListener("pointerleave", () => {
  lastMove = -1e9;
});

function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  if (!w || !h) return;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tan = Math.tan((camera.fov * Math.PI / 180) / 2);
  const visible = Math.max(2 / 0.9, (foxWidth / 0.86) / camera.aspect);
  const dist = visible / (2 * tan);

  camera.position.set(0, visible * 0.465, dist);
  camera.lookAt(0, visible * 0.465, 0);
  camera.updateProjectionMatrix();
}

const resizeObserver = new ResizeObserver(() => resize());
resizeObserver.observe(stage);
window.addEventListener("resize", resize);

const clock = new THREE.Clock();
const motionAllowed = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const euler = new THREE.Euler(0, 0, 0, "YXZ");
const tempMatrix4 = new THREE.Matrix4();

function frame() {
  const delta = clock.getDelta();
  const dt = Math.min(delta, 0.05);
  const t = clock.getElapsedTime();

  drawStars(t);

  const idle = performance.now() - lastMove > 3500;
  if (idle && motionAllowed) {
    aim.set(
      Math.sin(t * 0.55) * 0.55,
      Math.sin(t * 0.9 + 1) * 0.22 - 0.05
    );
  } else if (idle && !motionAllowed) {
    aim.set(0, 0);
  }

  look.lerp(aim, 1 - Math.exp(-dt * 11));
  turn.lerp(aim, 1 - Math.exp(-dt * 4.5));

  euler.set(turn.y * headPitch, turn.x * headYaw, -turn.x * 0.05, "YXZ");
  head.rotation.copy(euler);

  tempMatrix4.makeRotationFromEuler(euler);
  uHead.value.setFromMatrix4(tempMatrix4);

  const ex = THREE.MathUtils.clamp(look.x * 1.25 - turn.x * 0.35, -1, 1);
  const ey = THREE.MathUtils.clamp(look.y * 1.25 - turn.y * 0.35, -1, 1);

  if (leftEyeMesh) {
    leftEyeMesh.rotation.set(ey * eyePitch, ex * eyeYaw - leftEyeMesh.userData.side * eyeToe, 0, "YXZ");
  }
  if (rightEyeMesh) {
    rightEyeMesh.rotation.set(ey * eyePitch, ex * eyeYaw - rightEyeMesh.userData.side * eyeToe, 0, "YXZ");
  }

  fox.rotation.y = turn.x * 0.1;
  if (motionAllowed) {
    fox.position.y = Math.sin(t * 1.7) * 0.008;
    fox.scale.y = 1 + Math.sin(t * 1.7) * 0.006;
  }

  renderer.render(scene, camera);
}
</script>
