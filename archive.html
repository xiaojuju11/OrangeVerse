<!doctype html>
<html lang="zh-CN">

    <meta name="theme-color" content="#092329" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>宇宙档案 · OrangeVerse 橘域</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 网络字体改为 load 后异步注入：避免外网字体样式表阻塞首屏渲染、拖慢 load 事件 -->
    <script>
      (function () {
        var href =
          "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap";
        function inject() {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        }
        if (document.readyState === "complete") inject();
        else window.addEventListener("load", inject, { once: true });
      })();
    </script>
  </head>
  <body>
    <header class="masthead wrap">
      <a class="brand" href="./"><span aria-hidden="true"></span> OrangeVerse</a>
      <a class="text-link" href="./#ocean">去浅海漫游 <span aria-hidden="true">↗</span></a>
    </header>
    <main class="wrap">
      <section class="intro" aria-labelledby="title">
        <svg class="chart" viewBox="0 0 440 330" fill="none" aria-hidden="true">
          <g transform="rotate(-27 233 162)">
            <ellipse cx="233" cy="162" rx="187" ry="63" />
            <ellipse cx="233" cy="162" rx="155" ry="108" />
            <ellipse cx="233" cy="162" rx="106" ry="146" />
            <path d="M27 162h412M233 3v318" stroke-dasharray="2 7" />
          </g>
          <circle cx="233" cy="162" r="47" class="planet" />
          <circle cx="318" cy="67" r="5" class="chart-point" />
          <circle cx="102" cy="195" r="3" class="chart-point" />
          <circle cx="366" cy="190" r="3" class="chart-point" />
        </svg>
        <p class="eyebrow">ORANGEVERSE / PERSONAL ATLAS</p>
        <h1 id="title">宇宙档案<span>.</span></h1>
        <p class="intro-copy">我是小橘。这里收录了我的公开简历、开源项目、学习记录和技术文章。</p>
      </section>

      <section class="directory" aria-label="档案目录">

            <a href="#learning" data-section="learning">学习</a>

          <label class="search"><span>搜索档案</span><input type="search" id="archive-search" placeholder="例如 React、RAG" /></label>
        </div>
        <div class="results-meta">
          <p id="archive-status" role="status"></p>
          <a id="section-link" class="text-link" hidden></a>
        </div>
        <ul id="archive-list" class="archive-list"></ul>
        <noscript><p>打开 JavaScript 即可浏览档案。也可以直接<a href="./bookshelf.html">去知识书架</a>。</p></noscript>
      </section>
    </main>
    <footer class="wrap archive-footer"><span>小橘的个人宇宙</span><a class="text-link" href="./">回到岛上 ↗</a></footer>
    <script type="module" src="./src/archive.js"></script>
  </body>
</html>
